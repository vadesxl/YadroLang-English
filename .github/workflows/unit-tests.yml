name: Compiler regression tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run unit tests
        id: tests
        continue-on-error: true
        shell: bash
        run: python -m unittest discover -s tests -v > test.log 2>&1
      - name: Report failure
        if: steps.tests.outcome == 'failure' && github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          { echo 'Automated unittest failure:'; echo '```text'; tail -n 80 test.log; echo '```'; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
      - name: Fail job when tests failed
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: cat test.log && exit 1
